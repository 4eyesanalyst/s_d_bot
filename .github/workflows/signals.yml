name: Supply & Demand signals

# Runs on GitHub's servers, so your machine can be off.
#
# Every 20 minutes from the London open to the New York close, Monday to Friday.
# 07:00-22:59 UTC covers both DST regimes (summer London opens 07:00 and NY
# closes 21:00; winter it is 08:00 and 22:00). Outside these hours the workflow
# does not run at all, so the bot is effectively off overnight and at weekends.
# GitHub's scheduler is best-effort and can drift 5-15 minutes when it is busy;
# that is tolerable here because signals are limit orders resting at a zone,
# not market orders that need the exact second.
on:
  schedule:
    # Hourly triggers, each starting a watcher that polls for hours.
    #
    # Four slots a day was a mistake: GitHub silently drops scheduled runs on
    # the free tier, and with only four chances a single miss costs five hours
    # of coverage - which is exactly what happened. Redundant triggers are free
    # because cancel-in-progress means a new watcher simply takes over from the
    # running one, so a dropped slot is recovered within the hour instead of
    # leaving the market unwatched.
    - cron: "0 5-22 * * 1-5"
  workflow_dispatch:          # lets you trigger a run by hand from the Actions tab
    inputs:
      force:
        description: "Scan even outside session hours"
        type: boolean
        default: false
      watch_minutes:
        description: "Watch continuously for N minutes (0 = single scan)"
        type: string
        default: "0"

# Never let two scans run at once: they would both write state and one would
# lose, which is how a signal gets alerted twice or silently dropped.
permissions:
  contents: write             # needed to commit signal state back

jobs:
  scan:
    runs-on: ubuntu-latest
    # Dukascopy occasionally stalls for minutes at a time; 15 was
    # killing roughly one run in five.
    timeout-minutes: 25

    steps:
      # An hourly trigger is a *safety net*, not a restart. If a watcher is
      # already running, this exits in seconds and leaves it alone. If the last
      # one died or GitHub dropped a slot, this starts a fresh one. That gives
      # continuous 6-hour coverage AND recovery within the hour, which neither
      # a bare long cron nor cancel-in-progress could do on its own.
      - name: Stand down if a watcher is already live
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=50"                    --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          echo "other watchers running: $live"
          if [ "${live:-0}" -gt 0 ]; then
            echo "a watcher is already live - standing down"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Price history is large and slow to fetch. Caching it turns a 5-minute
      # cold start into a few seconds. The rolling key is deliberate: cache
      # entries are immutable, so each run writes a new one and restores from
      # the most recent prefix match.
      - name: Restore price cache
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: data
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      # A quiet market and a dead bot look identical from the outside. One
      # message a day at the London open is what distinguishes them.
      - name: Daily heartbeat (manual only; the scan sends it automatically)
        if: false
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_poll.py --heartbeat

      # One scan, for a manual "is it working" check.
      - name: Single scan (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.watch_minutes == '0'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_poll.py ${{ inputs.force && '--force' || '' }}

      # Scheduled runs watch continuously instead of scanning once and exiting.
      # This is what removes GitHub's 60-90 minute scheduler lag from the path
      # between a bar closing and the alert reaching the phone.
      - name: Watch the market
        if: >-
          steps.guard.outputs.skip != 'true' &&
          (github.event_name == 'schedule' || inputs.watch_minutes != '0')
        timeout-minutes: 355
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MINUTES="${{ inputs.watch_minutes || '0' }}"
          if [ "$MINUTES" = "0" ] || [ -z "$MINUTES" ]; then MINUTES=330; fi
          python github_watch.py --max-minutes "$MINUTES" --interval 90

      # Committing state back is what gives the bot memory between runs, and it
      # keeps the repository active so GitHub does not pause the schedule after
      # 60 days of quiet.
      # always() so state survives cancellation, but not when we stood down --
      # there is no checkout in that case and git would fail on an empty tree.
      - name: Persist signal state
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "sd-bot"
          git config user.email "sd-bot@users.noreply.github.com"
          git add -A signals/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "signal state $(date -u '+%Y-%m-%d %H:%M')Z"
            git push
          fi
